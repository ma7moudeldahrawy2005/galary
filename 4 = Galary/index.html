<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallary">
        <div class="photos">
            <img onclick="main.src = this.src" src="imgs/1.png" alt="">
            <img onclick="main.src = this.src" src="imgs/2.png" alt="">
            <img onclick="main.src = this.src" src="imgs/3.png" alt="">
            <img onclick="main.src = this.src" src="imgs/4.png" alt="">
        </div>
        <div class="main">
            <img class="section" name="main" src="imgs/1.png" alt="">
        </div>
        <div class="photos">
            <img onmouseover="main.src = this.src" src="imgs/5.png" alt="">
            <img onmouseover="main.src = this.src" src="imgs/6.png" alt="">
            <img onmouseover="main.src = this.src" src="imgs/7.png" alt="">
            <img onmouseover="main.src = this.src" src="imgs/8.png" alt="">
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
